name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # API keys from repo secrets (empty until added — those features stay off)
      TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
      VIC_ROADS_KEY: ${{ secrets.VIC_ROADS_KEY }}
      PTV_DEV_ID: ${{ secrets.PTV_DEV_ID }}
      PTV_KEY: ${{ secrets.PTV_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | grep -v beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install packages
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild -p ios --clean

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/NLSMaps.xcworkspace \
            -scheme NLSMaps \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/NLSMaps.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 200
          test -d build/NLSMaps.xcarchive/Products/Applications/NLSMaps.app

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/NLSMaps.xcarchive/Products/Applications/NLSMaps.app Payload/
          ls Payload/NLSMaps.app/PlugIns || echo "No extensions found"
          zip -qry NLSMaps.ipa Payload
          ls -lh NLSMaps.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" NLSMaps.ipa \
            --title "NLS Maps build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. Install with SideStore." \
            --latest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NLSMaps-ipa
          path: NLSMaps.ipa
          if-no-files-found: ignore
